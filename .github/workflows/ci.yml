name: FluxScript CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: fluxscript-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build
      - run: python -m compileall -q fluxscript tests
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m pip install --no-deps dist/fluxscript-0.1.0-py3-none-any.whl
      - run: fluxscript --version

  web-smoke:
    name: Generated web smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: fluxscript new /tmp/fluxscript-smoke
      - run: fluxscript check /tmp/fluxscript-smoke/app.py
      - run: fluxscript build /tmp/fluxscript-smoke/app.py --target web --out /tmp/fluxscript-smoke/build/web
      - run: node --check /tmp/fluxscript-smoke/build/web/app.js
      - run: cd /tmp/fluxscript-smoke/build/web && npm install && npm run typecheck
